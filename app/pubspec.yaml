    sdk: flutter
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
